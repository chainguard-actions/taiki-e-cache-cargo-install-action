name: Test locked=false option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          cargo --version
      - name: Ensure RUNNER_TOOL_CACHE exists
        run: mkdir -p /opt/hostedtoolcache
      - name: Install tool without --locked flag
        id: action
        uses: .
        with:
          tool: toml-cli@0.2.3
          locked: 'false'
      - name: Assert tool is installed and on PATH
        run: |
          echo "Checking if toml-cli is available on PATH (locked=false)..."
          if ! command -v toml > /dev/null 2>&1; then
            echo "FAIL: toml-cli (toml) not found on PATH"
            exit 1
          fi
          echo "PASS: toml-cli is available on PATH with locked=false"
      - name: Assert tool produces output
        run: |
          VERSION_OUTPUT=$(toml --version 2>&1 || true)
          echo "actual: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: toml --version produced no output"
            exit 1
          fi
          echo "PASS: toml-cli installed without --locked: $VERSION_OUTPUT"
