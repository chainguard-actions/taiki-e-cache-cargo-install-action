name: Test git + tag install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install cargo-hack from git with tag
        id: action
        uses: .
        with:
          tool: cargo-hack
          git: https://github.com/taiki-e/cargo-hack
          tag: v0.6.28
      - name: Assert cargo-hack is installed
        run: |
          echo "Checking cargo-hack is available..."
          if ! command -v cargo-hack > /dev/null 2>&1; then
            # Try via cargo
            if ! cargo hack --version > /dev/null 2>&1; then
              echo "FAIL: cargo-hack not found after git+tag install"
              exit 1
            fi
          fi
          echo "PASS: cargo-hack installed from git+tag"
