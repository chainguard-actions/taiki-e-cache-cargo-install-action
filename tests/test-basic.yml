name: Test basic usage - install specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /home/runner/.cache/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust toolchain
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          cargo --version
          mkdir -p "$RUNNER_TOOL_CACHE"
      - id: action
        uses: .
        with:
          tool: toml-cli@0.2.3
      - name: Assert binary is available
        run: |
          echo "Checking if toml binary is available..."
          TOOL_BIN="$RUNNER_TOOL_CACHE/toml-cli/bin/toml"
          echo "Looking for binary at: $TOOL_BIN"
          if [ -f "$TOOL_BIN" ]; then
            echo "PASS: 'toml' binary found at $TOOL_BIN"
          elif command -v toml > /dev/null 2>&1; then
            echo "PASS: 'toml' binary found at $(command -v toml)"
          else
            echo "FAIL: 'toml' binary not found"
            ls -la "$RUNNER_TOOL_CACHE/" 2>/dev/null || echo "(tool cache dir not found)"
            exit 1
          fi
      - name: Assert binary works
        run: |
          echo "Checking if toml binary works..."
          TOOL_BIN="$RUNNER_TOOL_CACHE/toml-cli/bin/toml"
          if command -v toml > /dev/null 2>&1; then
            VERSION_OUTPUT=$(toml --version 2>&1 || true)
          elif [ -f "$TOOL_BIN" ]; then
            VERSION_OUTPUT=$("$TOOL_BIN" --version 2>&1 || true)
          else
            echo "FAIL: toml binary not found"
            exit 1
          fi
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: toml --version returned empty output"
            exit 1
          fi
          echo "PASS: toml binary is functional"
