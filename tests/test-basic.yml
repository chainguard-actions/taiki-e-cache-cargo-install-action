name: Test basic usage - install crate with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          cargo --version

      - name: Install toml-cli at specific version
        id: action
        uses: .
        with:
          tool: toml-cli@0.2.3
          locked: 'false'

      - name: Assert toml-cli is installed and on PATH
        run: |
          echo "Checking toml-cli is available..."
          if ! command -v toml > /dev/null 2>&1; then
            echo "FAIL: toml command not found on PATH"
            exit 1
          fi
          echo "PASS: toml command found"
          toml --version || true
