name: Test install from git with rev
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cargo --version || "$HOME/.cargo/bin/cargo" --version
      - name: Install toml-cli from git with rev
        id: action
        uses: .
        with:
          tool: toml-cli
          git: https://github.com/gnprice/toml-cli
          # commit SHA corresponding to v0.2.3 tag
          rev: 'b0d938a'
          locked: 'false'
      - name: Assert toml-cli is installed
        run: |
          echo "Checking toml-cli is available after git+rev install..."
          TOOL_BIN="${RUNNER_TOOL_CACHE}/toml-cli/bin"
          echo "Tool bin dir: $TOOL_BIN"
          if [ -f "${TOOL_BIN}/toml" ]; then
            echo "PASS: toml binary found in tool cache"
            "${TOOL_BIN}/toml" --version || true
          elif command -v toml > /dev/null 2>&1; then
            echo "PASS: toml is available in PATH"
            toml --version
          else
            echo "FAIL: toml not found in PATH or tool cache"
            ls -la "${TOOL_BIN}" 2>/dev/null || echo "Tool bin dir does not exist"
            exit 1
          fi
