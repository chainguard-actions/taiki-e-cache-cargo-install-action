name: Test install from git rev
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust
        run: |
          mkdir -p /opt/hostedtoolcache
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install toml-cli from git rev
        id: action
        uses: .
        with:
          tool: toml-cli
          git: https://github.com/gnprice/toml-cli
          # This is the commit SHA that the v0.2.3 tag points to in gnprice/toml-cli
          rev: a9e4e7b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1
          locked: 'false'
        continue-on-error: true
      - name: Assert action ran with rev input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking toml-cli is available after git rev install..."
            if ! command -v toml > /dev/null 2>&1; then
              echo "FAIL: toml not found in PATH after successful install"
              exit 1
            fi
            echo "PASS: toml-cli installed from git rev"
            toml --version
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with rev input (failed gracefully - rev may not resolve in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
