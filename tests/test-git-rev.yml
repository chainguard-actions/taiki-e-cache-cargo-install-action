name: Test git install with rev
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure RUNNER_TOOL_CACHE exists
        run: mkdir -p /opt/hostedtoolcache
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Resolve commit SHA for toml-cli v0.2.3
        id: resolve-rev
        run: |
          # Use ^{} dereference to get the commit SHA even for annotated tags
          REV=$(git ls-remote https://github.com/gnprice/toml-cli refs/tags/v0.2.3^{} | awk '{print $1}')
          if [ -z "$REV" ]; then
            # Fallback: try without dereference (lightweight tag)
            REV=$(git ls-remote https://github.com/gnprice/toml-cli refs/tags/v0.2.3 | awk '{print $1}')
          fi
          echo "Resolved rev: $REV"
          if [ -z "$REV" ]; then
            echo "FAIL: could not resolve commit SHA for v0.2.3 tag"
            exit 1
          fi
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
      - name: Install toml-cli from git with specific rev
        id: action
        uses: .
        with:
          tool: toml-cli
          git: https://github.com/gnprice/toml-cli
          rev: ${{ steps.resolve-rev.outputs.rev }}
          locked: 'true'
      - name: Assert toml-cli is installed and on PATH
        run: |
          echo "PATH: $PATH"
          echo "Checking toml command is available on PATH..."
          if ! command -v toml > /dev/null 2>&1; then
            echo "FAIL: toml command not found on PATH"
            exit 1
          fi
          echo "PASS: toml command found"
      - name: Assert toml-cli version is correct
        run: |
          VERSION=$(toml --version 2>&1 || true)
          echo "actual version output: $VERSION"
          if echo "$VERSION" | grep -q "0.2.3"; then
            echo "PASS: version 0.2.3 confirmed"
          else
            echo "FAIL: expected version 0.2.3 in output: $VERSION"
            exit 1
          fi
