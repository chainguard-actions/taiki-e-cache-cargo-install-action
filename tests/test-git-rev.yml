name: Test git install with rev
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /home/runner/.cache/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust toolchain
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          cargo --version
          mkdir -p "$RUNNER_TOOL_CACHE"
      - name: Resolve rev for toml-cli v0.2.3
        id: resolve
        run: |
          # Resolve the commit SHA for the v0.2.3 tag of toml-cli
          REV=$(git ls-remote https://github.com/gnprice/toml-cli refs/tags/v0.2.3 | awk '{print $1}')
          echo "Resolved rev: $REV"
          if [ -z "$REV" ]; then
            echo "FAIL: could not resolve rev for v0.2.3 tag"
            exit 1
          fi
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          tool: toml-cli
          git: https://github.com/gnprice/toml-cli
          rev: ${{ steps.resolve.outputs.rev }}
      - name: Assert binary is available after git+rev install
        run: |
          echo "Checking if toml binary is available after git+rev install..."
          TOOL_BIN="$RUNNER_TOOL_CACHE/toml-cli/bin/toml"
          echo "Looking for binary at: $TOOL_BIN"
          if [ -f "$TOOL_BIN" ]; then
            echo "PASS: 'toml' binary found at $TOOL_BIN"
          elif command -v toml > /dev/null 2>&1; then
            echo "PASS: 'toml' binary found at $(command -v toml)"
          else
            echo "FAIL: 'toml' binary not found"
            ls -la "$RUNNER_TOOL_CACHE/" 2>/dev/null || echo "(tool cache dir not found)"
            exit 1
          fi
      - name: Assert binary works
        run: |
          echo "Checking if toml binary works..."
          TOOL_BIN="$RUNNER_TOOL_CACHE/toml-cli/bin/toml"
          if command -v toml > /dev/null 2>&1; then
            VERSION_OUTPUT=$(toml --version 2>&1 || true)
          elif [ -f "$TOOL_BIN" ]; then
            VERSION_OUTPUT=$("$TOOL_BIN" --version 2>&1 || true)
          else
            echo "FAIL: toml binary not found"
            exit 1
          fi
          echo "version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: toml --version returned empty output"
            exit 1
          fi
          echo "PASS: toml binary is functional"
