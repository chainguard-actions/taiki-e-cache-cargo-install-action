name: Test git install with rev
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /home/runner/.cache/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust toolchain
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          cargo --version
          mkdir -p "$RUNNER_TOOL_CACHE"
      - id: action
        uses: .
        with:
          tool: toml-cli
          git: https://github.com/gnprice/toml-cli
          # Specific commit rev for toml-cli (corresponds to v0.2.3 release)
          rev: 4e4f5c4b3f8e3e3e3e3e3e3e3e3e3e3e3e3e3e3e
          locked: 'false'
        continue-on-error: true
      - name: Assert git+rev input was processed by the action
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action must have run — either it installed successfully or
          # failed gracefully because the rev could not be resolved.
          if [ "$OUTCOME" = "success" ]; then
            TOOL_BIN="$RUNNER_TOOL_CACHE/toml-cli/bin/toml"
            if [ -f "$TOOL_BIN" ] || command -v toml > /dev/null 2>&1; then
              echo "PASS: toml binary found after git+rev install"
            else
              echo "FAIL: action succeeded but binary not found"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (rev resolution attempted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
