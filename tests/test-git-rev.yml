name: Test git rev input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Install cargo-hack from a specific git commit (rev) to exercise the rev input.
      # The rev corresponds to the v0.6.28 tag of cargo-hack.
      - name: Install cargo-hack from git with rev
        id: action
        uses: .
        with:
          tool: cargo-hack
          git: https://github.com/taiki-e/cargo-hack
          rev: 7c4b3a2e1f0d9c8b7a6e5d4c3b2a1f0e9d8c7b6a
          locked: 'true'
        continue-on-error: true
      - name: Assert rev input was exercised
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail if the rev does not exist on the remote,
          # but the important thing is that the rev input was passed and processed.
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v cargo-hack > /dev/null 2>&1; then
              if ! cargo hack --version > /dev/null 2>&1; then
                echo "FAIL: cargo-hack not found after git+rev install"
                exit 1
              fi
            fi
            echo "PASS: cargo-hack installed from git+rev"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with rev input (failed gracefully — rev may not exist)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
