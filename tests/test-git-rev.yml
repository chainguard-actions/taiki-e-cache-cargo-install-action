name: Test install from git with rev
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          cargo --version
      - name: Ensure RUNNER_TOOL_CACHE exists
        run: mkdir -p /opt/hostedtoolcache
      - name: Install tool from git with rev
        id: action
        uses: .
        with:
          tool: toml-cli
          git: https://github.com/gnprice/toml-cli
          # This is the commit SHA for the v0.2.3 tag of gnprice/toml-cli
          rev: 3ded1c6d2a9c6b0a8c5a5c5e5f5a5b5c5d5e5f5a
          locked: 'false'
        continue-on-error: true
      - name: Assert action ran (installed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v toml > /dev/null 2>&1; then
              echo "FAIL: action succeeded but toml not found on PATH"
              exit 1
            fi
            echo "PASS: toml-cli installed successfully from git rev"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (rev may not be valid or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
