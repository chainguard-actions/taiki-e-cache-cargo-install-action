name: Test all-features flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure RUNNER_TOOL_CACHE exists
        run: mkdir -p /opt/hostedtoolcache
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install toml-cli with all-features
        id: action
        uses: .
        with:
          tool: toml-cli@0.2.3
          locked: 'true'
          all-features: 'true'
      - name: Assert toml-cli is installed
        run: |
          echo "PATH: $PATH"
          echo "Checking toml command is available..."
          if ! command -v toml > /dev/null 2>&1; then
            echo "FAIL: toml command not found on PATH"
            exit 1
          fi
          echo "PASS: toml command found after install with --all-features"
