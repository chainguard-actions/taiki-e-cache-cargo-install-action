name: Test install specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust
        run: |
          mkdir -p /opt/hostedtoolcache
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install specific version of toml-cli
        id: action
        uses: .
        with:
          tool: toml-cli@0.2.3
          locked: 'false'
      - name: Assert correct version is installed
        run: |
          echo "PATH: $PATH"
          echo "Checking toml-cli version..."
          if ! command -v toml > /dev/null 2>&1; then
            echo "FAIL: toml not found in PATH"
            ls -la /opt/hostedtoolcache/ 2>/dev/null || echo "tool cache dir not found"
            exit 1
          fi
          VERSION=$(toml --version 2>&1 | head -1)
          echo "actual: $VERSION"
          if ! echo "$VERSION" | grep -q '0.2.3'; then
            echo "FAIL: expected version 0.2.3, got: $VERSION"
            exit 1
          fi
          echo "PASS: correct version installed"
